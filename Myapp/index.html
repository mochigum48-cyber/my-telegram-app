<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RO_Bookshelf</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f4efe6;
      --card: #ffffff;
      --text: #222222;
      --muted: #6b6b6b;
      --primary: #7a4f2a;
      --primary-dark: #5f3d20;
      --line: #e7dfd3;
      --nav: #fffaf2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      padding-bottom: 78px;
    }
    .header {
      padding: 18px 18px 10px;
      text-align: center;
    }
    .logo {
      width: 92px;
      height: 92px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      margin: 0 auto 12px;
      background: #ddd;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }
    .subtitle {
      margin: 6px 0 0;
      color: var(--primary);
      font-size: 16px;
      font-weight: 700;
    }
    .desc {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .search-wrap {
      padding: 14px 18px 6px;
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    .section {
      padding: 10px 18px 0;
    }
    .section-title {
      margin: 10px 0 12px;
      font-size: 18px;
      font-weight: 700;
    }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
      color: var(--text);
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .book-list {
      padding: 0 18px 12px;
      display: grid;
      gap: 14px;
    }
    .book-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
    }
    .cover-box {
      width: 74px;
      height: 98px;
      border-radius: 12px;
      background: #efe6d7;
      overflow: hidden;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b6a4b;
      font-size: 13px;
      text-align: center;
      padding: 8px;
    }
    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .book-info {
      flex: 1;
      min-width: 0;
    }
    .book-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .author {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .download-btn {
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .download-btn:active {
      background: var(--primary-dark);
    }
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: var(--nav);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      padding: 10px 8px 14px;
    }
    .nav-item {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .nav-item.active {
      color: var(--primary);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <img class="logo" src="logo.webp" alt="RO Bookshelf logo">
      <h1>RO_Bookshelf</h1>
      <p class="subtitle">Explore the World Through Books</p>
      <p class="desc">စာအုပ်များ ရှာဖွေပါ</p>
      <p class="desc">သင့်စိတ်ကြိုက် စာအုပ်များကို ရှာပြီး Download လုပ်ပါ။</p>
    </div>

    <div class="search-wrap">
      <input class="search" type="text" placeholder="စာအုပ်၊ Author ရှာရန်..." />
    </div>

    <div class="section">
      <div class="section-title">အမျိုးအစားများ</div>
      <div class="chips">
        <div class="chip active">အားလုံး</div>
        <div class="chip">Novels</div>
        <div class="chip">Education</div>
        <div class="chip">Business</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">နောက်ဆုံးတင်ထားသောစာအုပ်များ</div>
    </div>

    <div class="book-list" id="bookList">
      <!-- Books will be loaded from Bot -->
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">⌂<br>Home</div>
      <div class="nav-item">▦<br>Categories</div>
      <div class="nav-item">♡<br>Saved</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const BOT_API_URL = 'https://enn-storage-bot.onrender.com/api/books';

    async function loadBooks() {
      try {
        const response = await fetch(BOT_API_URL);
        const books = await response.json();

        const bookList = document.getElementById('bookList');
        bookList.innerHTML = '';

        books.forEach(book => {
          const card = document.createElement('div');
          card.className = 'book-card';
          card.innerHTML = `
            <div class="cover-box">
              <img src="${book.cover || 'book-cover.jpg'}" alt="Book cover">
            </div>
            <div class="book-info">
              <p class="book-title">${book.title}</p>
              <p class="author">${book.author}</p>
              <p class="meta">PDF • ${book.size} MB</p>
              <button class="download-btn" onclick="downloadBook('${book.id}')">Download</button>
            </div>
          `;
          bookList.appendChild(card);
        });
      } catch (error) {
        console.error('Failed to load books:', error);
        document.getElementById('bookList').innerHTML = '<p style="text-align:center;padding:20px;">❌ စာအုပ်များ ရယူရန် မအောင်မြင်ပါ။</p>';
      }
    }

    function downloadBook(bookId) {
      if (!tg) {
        alert('Please open this app from Telegram!');
        return;
      }
      tg.sendData(JSON.stringify({
        action: 'download',
        bookId: `book_${bookId}`
      }));
    }

    loadBooks();
  </script>
</body>
</html>
