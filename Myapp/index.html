<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <meta name="theme-color" content="#0A0C1F">
  <title>MM Digital Library</title>

  <link rel="stylesheet" href="css/home.css">

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>

<body>
  <main class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <span>✦</span>
        </div>

        <div class="brand-text">
          <h1>MM Digital Library</h1>
          <p>Your reading garden</p>
        </div>
      </div>

      <button
        class="profile-button"
        type="button"
        data-open-profile
        aria-label="Open profile"
      >
        ◌
      </button>
    </header>

    <section class="greeting">
      <p class="greeting-small">WELCOME BACK, READER</p>
      <h2>
        ဒီနေ့ ဘယ်ဇာတ်လမ်းကို<br>
        <span>ဖတ်ကြမလဲ?</span>
      </h2>
    </section>

    <section class="search-section">
      <label class="search-box" for="searchInput">
        <span class="search-symbol">⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="စာအုပ်ရှာရန်..."
          autocomplete="off"
        >

        <button
          id="clearButton"
          class="clear-button"
          type="button"
          aria-label="Clear search"
        >
          ×
        </button>
      </label>
    </section>

    <section class="section" id="homeSection">
      <div class="section-title-row">
        <h2>ဆက်ဖတ်ရန်</h2>

        <button
          class="text-button"
          type="button"
          data-show-library
        >
          အားလုံးကြည့်ရန်
        </button>
      </div>

      <article class="continue-card">
        <div class="continue-cover">
          <div class="cover-orbit"></div>
          <div class="cover-flower">✿</div>
          <div class="cover-star">✦</div>
        </div>

        <div class="continue-info">
          <span class="status-label">BLOOMING · 65%</span>
          <h3>မိုးရာသီရဲ့အိပ်မက်</h3>
          <p class="author">မောင်မောင်</p>

          <div class="progress-row">
            <div class="progress-bar">
              <span style="width: 65%"></span>
            </div>
            <span class="progress-number">65%</span>
          </div>

          <button
            class="continue-button"
            type="button"
            data-read-current
          >
            ဆက်ဖတ်ရန်
            <span>→</span>
          </button>
        </div>
      </article>

      <div class="section-title-row" style="margin-top: 24px;">
        <h2>အမျိုးအစားများ</h2>

        <button
          class="text-button"
          type="button"
          data-show-explore
        >
          ပိုကြည့်ရန်
        </button>
      </div>

      <div class="category-list">
        <button class="category active" type="button" data-category="all">အားလုံး</button>
        <button class="category" type="button" data-category="ဝတ္ထု">ဝတ္ထု</button>
        <button class="category" type="button" data-category="ပညာရေး">ပညာရေး</button>
        <button class="category" type="button" data-category="သမိုင်း">သမိုင်း</button>
        <button class="category" type="button" data-category="စိတ်ကူးယဉ်">စိတ်ကူးယဉ်</button>
      </div>

      <div class="section-title-row">
        <h2>စာအုပ်အသစ်များ</h2>

        <button
          class="text-button"
          type="button"
          data-open-shop
        >
          Shop ကြည့်ရန်
        </button>
      </div>

      <div class="book-scroller" id="bookScroller"></div>

      <p class="not-found" id="notFound" hidden>
        ရှာဖွေထားသော စာအုပ်မတွေ့ပါ။
      </p>
    </section>

    <section class="section" id="shopSection" hidden>
      <div class="section-title-row">
        <h2>Shop</h2>

        <button
          class="text-button"
          type="button"
          data-go-home
        >
          Home
        </button>
      </div>

      <div class="shop-scroller" id="shopScroller"></div>
    </section>

    <section class="profile-panel" id="profilePanel" hidden>
      <div class="profile-panel-head">
        <h2>Profile</h2>

        <button
          class="close-button"
          type="button"
          data-close-profile
          aria-label="Close profile"
        >
          ×
        </button>
      </div>

      <div class="profile-user">
        <div class="profile-avatar">◌</div>

        <div>
          <h3 id="profileName">Reader</h3>
          <p id="profileUsername">@reader</p>
        </div>
      </div>

      <div class="profile-stat-row">
        <div class="profile-stat">
          <strong>12</strong>
          <span>ဖတ်ပြီး</span>
        </div>

        <div class="profile-stat">
          <strong id="savedCount">0</strong>
          <span>သိမ်းထား</span>
        </div>

        <div class="profile-stat">
          <strong>65%</strong>
          <span>ခရီးစဉ်</span>
        </div>
      </div>

      <button class="profile-menu-item" type="button" data-show-library>
        <span>✧</span>
        <span>My Library</span>
        <b>›</b>
      </button>

      <button class="profile-menu-item" type="button" data-toggle-theme>
        <span>☾</span>
        <span>Night Garden</span>
        <b id="themeStatus">ON</b>
      </button>

      <button class="profile-menu-item" type="button">
        <span>?</span>
        <span>Help &amp; Support</span>
        <b>›</b>
      </button>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" type="button" data-go-home>
      <span>⌂</span>
      <small>ပင်မ</small>
    </button>

    <button class="nav-item" type="button" data-show-explore>
      <span>⌕</span>
      <small>ရှာရန်</small>
    </button>

    <button class="nav-item" type="button" data-show-library>
      <span>✧</span>
      <small>Library</small>
    </button>

    <button class="nav-item" type="button" data-open-profile>
      <span>◌</span>
      <small>Profile</small>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
