<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader's Odyssey</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- ===== Navigation Bottom ===== -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="home">
            <span class="nav-icon">✦</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="explore">
            <span class="nav-icon">✧</span>
            <span class="nav-label">Explore</span>
        </button>
        <button class="nav-item" data-page="library">
            <span class="nav-icon">◈</span>
            <span class="nav-label">Library</span>
        </button>
        <button class="nav-item" data-page="profile">
            <span class="nav-icon">☽</span>
            <span class="nav-label">Profile</span>
        </button>
    </nav>

    <!-- ===== Pages ===== -->
    <main id="app">
        <!-- Home Page -->
        <section id="page-home" class="page active">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">✦</span>
                    <span class="logo-text">Reader's Odyssey</span>
                </div>
                <div class="header-subtitle">Explore the world through books</div>
            </div>

            <!-- Search -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search books..." />
            </div>

            <!-- Categories -->
            <div class="category-scroll">
                <button class="category-chip active" data-cat="all">All</button>
                <button class="category-chip" data-cat="mystery">Mystery</button>
                <button class="category-chip" data-cat="romance">Romance</button>
                <button class="category-chip" data-cat="fantasy">Fantasy</button>
                <button class="category-chip" data-cat="knowledge">Knowledge</button>
                <button class="category-chip" data-cat="history">History</button>
            </div>

            <!-- Book Grid -->
            <div class="book-grid" id="bookGrid"></div>
        </section>

        <!-- Explore Page -->
        <section id="page-explore" class="page">
            <div class="page-placeholder">
                <span class="placeholder-icon">✧</span>
                <h2>Explore</h2>
                <p>Discover new books and authors</p>
            </div>
        </section>

        <!-- Library Page -->
        <section id="page-library" class="page">
            <div class="page-placeholder">
                <span class="placeholder-icon">◈</span>
                <h2>My Library</h2>
                <p>Your downloaded books will appear here</p>
            </div>
        </section>

        <!-- Profile Page -->
        <section id="page-profile" class="page">
            <div class="page-placeholder">
                <span class="placeholder-icon">☽</span>
                <h2>Profile</h2>
                <p>Your reading journey</p>
            </div>
        </section>
    </main>

    <!-- ===== Ad Modal ===== -->
    <div id="adModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-icon">🌱</div>
            <h3>Watch Ad & Unlock</h3>
            <p>Watch a short ad to download this book</p>
            <button id="watchAdBtn" class="btn-gold">▶ Watch Ad</button>
            <button id="closeModalBtn" class="btn-ghost">Cancel</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/telegram.js"></script>
    <script src="js/books.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
